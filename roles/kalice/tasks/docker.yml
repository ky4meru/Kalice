---
- name: Ensure the docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add the configured user to the docker group
  ansible.builtin.user:
    name: "{{ kalice_user }}"
    groups: docker
    append: true

- name: Start and enable the docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
