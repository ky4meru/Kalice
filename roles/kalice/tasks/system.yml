---
- name: Check for the apt sources list
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: kalice_apt_sources
  tags: apt

- name: Point apt at the configured Kali mirror
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: 'https?://[^/\s]+/kali\b'
    replace: "{{ kalice_apt_mirror }}"
    backup: true
  register: kalice_apt_mirror_set
  when: kalice_apt_sources.stat.exists
  tags: apt

- name: Update and upgrade apt packages
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: "{{ 0 if kalice_apt_mirror_set.changed else 3600 }}"
    autoremove: true
    autoclean: true
    purge: true
  tags: apt

- name: Install useful apt packages
  ansible.builtin.apt:
    pkg: "{{ item }}"
  loop: "{{ kalice_apt_packages }}"
  ignore_errors: true
  tags: apt

- name: Allow passwordless sudo for the configured user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/kalice
    content: |
      {{ kalice_user }} ALL=(ALL) NOPASSWD:ALL
    owner: root
    group: root
    mode: '0440'
    validate: visudo -cf %s
  when: kalice_sudo_nopasswd
  tags: sudo

- name: Set timezone
  community.general.timezone:
    name: "{{ kalice_timezone }}"

- name: Enable auditd
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    masked: false
  when: "'auditd' in kalice_apt_packages"

- name: Set vim as default editor
  community.general.alternatives:
    name: editor
    path: "{{ kalice_editor }}"

- name: Download hashcat rules
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ kalice_hashcat_rules_dir }}/{{ item.name }}"
    mode: '0644'
  loop: "{{ kalice_hashcat_rules }}"
  ignore_errors: true
